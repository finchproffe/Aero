<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title">
  <title id="title">Aero</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26292F"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Airflow: a crossbar that runs past the letter and thins out, lifting slightly like a wing. -->
    <path id="flow" d="M86 136 Q 160 135 234 117 Q 162 160 86 158 Z"/>
    <clipPath id="right-of-apex">
      <rect x="140" y="0" width="116" height="256"/>
    </clipPath>
    <!-- The airflow passes in front of the right leg: cut a gap around it. -->
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="#FFFFFF"/>
      <use href="#flow" fill="#000000" stroke="#000000" stroke-width="18" stroke-linejoin="round"
           clip-path="url(#right-of-apex)"/>
    </mask>
  </defs>

  <rect width="256" height="256" rx="58" fill="url(#sky)"/>
  <rect width="256" height="256" rx="58" fill="url(#glow)"/>

  <!-- Shifted left: the airflow tail makes the mark right-heavy. -->
  <g transform="translate(-6 0)">
    <path d="M64 198 L132 56 L196 198" fill="none" stroke="#FFFFFF" stroke-width="28"
          stroke-linecap="round" stroke-linejoin="round" mask="url(#gap)"/>
    <use href="#flow" fill="#FFFFFF"/>
  </g>
</svg>
