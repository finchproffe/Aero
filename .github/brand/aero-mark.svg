<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 40 200 176" role="img" aria-labelledby="title">
  <title id="title">Aero</title>
  <!-- Same geometry as aero-icon.svg without the tile; takes the surrounding text color. -->
  <defs>
    <path id="flow" d="M86 136 Q 160 135 234 117 Q 162 160 86 158 Z"/>
    <clipPath id="right-of-apex">
      <rect x="140" y="0" width="116" height="256"/>
    </clipPath>
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="#FFFFFF"/>
      <use href="#flow" fill="#000000" stroke="#000000" stroke-width="18" stroke-linejoin="round"
           clip-path="url(#right-of-apex)"/>
    </mask>
  </defs>

  <path d="M64 198 L132 56 L196 198" fill="none" stroke="currentColor" stroke-width="28"
        stroke-linecap="round" stroke-linejoin="round" mask="url(#gap)"/>
  <use href="#flow" fill="currentColor"/>
</svg>
