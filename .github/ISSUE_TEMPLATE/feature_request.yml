name: Feature proposal
description: Propose a user-visible Aero capability
title: "[Feature]: "
labels: ["proposal"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the problem without prescribing the implementation.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Privacy, security, compatibility, and performance impact
    validations:
      required: true
