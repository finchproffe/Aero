[package]
name = "aero_security_native"
version = "0.26.0"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "Aero anti-stealer core: protected secret memory, cookie vault sealing, process guard."

[lib]
crate-type = ["cdylib"]

[dependencies]
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "zeroize"] }
# Not used directly: turns on key-schedule wiping inside the AES cipher aes-gcm already pulls in.
aes = { version = "0.8", features = ["zeroize"] }
zeroize = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ErrorReporting",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# A panic must never unwind into .NET: abort and fail closed.
panic = "abort"
lto = true
codegen-units = 1
strip = "symbols"
